name: Release
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: release-git-runner
  cancel-in-progress: false
jobs:
  build:
    runs-on: [linux-amd64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build + push ghcr.io/hanzoai/git-runner
        env:
          GH_TOKEN: ${{ secrets.MIRROR_GH_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u hanzo-dev --password-stdin
          VER=0.6.1-hanzo.$(git rev-parse --short=7 HEAD)
          # multi-target Dockerfile: dind is THE fleet image (s6 + dockerd +
          # git-runner); a bare build ships the last stage (basic) — no docker.
          docker build --target dind -t "ghcr.io/hanzoai/git-runner:${VER}" .
          docker push "ghcr.io/hanzoai/git-runner:${VER}"
          echo "pushed ghcr.io/hanzoai/git-runner:${VER}"
